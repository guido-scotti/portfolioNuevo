<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Portfolio web desarrollado por Guido Scotti">
  <meta name="keywords" content="portfolio, web, developer, web design, programacion">
  <meta name="author" content="Guido Scotti">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guido Scotti</title>
  <link rel="icon" href="/img/png/gslogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<header class="reveal-up fixed top-0 z-[999] flex h-[10%] min-h-16 w-full items-center justify-between bg-bg px-5 py-2.5 shadow-md md:px-10">
  <a href="#top" class="p-2.5 text-2xl font-bold transition hover:scale-105">Guido<span class="grad-text">.dev</span></a>
  <nav class="hidden items-center gap-3 md:flex lg:mr-28 lg:gap-6">
    <a href="#top" class="nav-a" data-i18n="nav.home"></a>
    <a href="#about" class="nav-a" data-i18n="nav.about"></a>
    <a href="#techstack" class="nav-a" data-i18n="nav.training"></a>
    <a href="#projects" class="nav-a" data-i18n="nav.projects"></a>
    <a href="#contacto" class="nav-a" data-i18n="nav.contact"></a>
    <div class="flex items-center gap-1 rounded-full border border-brand/60 bg-card p-1">
      <a href="#" class="lang-btn" data-lang="en">EN</a>
      <a href="#" class="lang-btn" data-lang="es">ES</a>
    </div>
  </nav>
  <div class="flex items-center gap-1 rounded-full border border-brand/60 bg-card p-1 md:hidden">
    <a href="#" class="lang-btn" data-lang="en">EN</a>
    <a href="#" class="lang-btn" data-lang="es">ES</a>
  </div>
</header>

<!-- SIDEBAR -->
<aside id="social-side" class="fixed left-0 top-1/2 z-[9999] hidden -translate-y-1/2 flex-col items-center gap-5 rounded-r-xl border border-l-0 border-accent bg-card px-5 py-8 shadow-[0_0_18px_rgba(79,172,254,0.55)] lg:flex"></aside>

<!-- HOME -->
<section id="top" class="relative isolate flex min-h-screen w-full flex-col items-center justify-center gap-8 overflow-x-hidden px-6 pt-20 text-center md:flex-row md:justify-start md:text-left lg:pl-40 xl:pl-60">
  <div class="pointer-events-none absolute -left-40 top-1/4 -z-10 size-96 rounded-full bg-brand/25 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-20 bottom-0 -z-10 size-80 rounded-full bg-accent/20 blur-3xl"></div>
  <div class="hero-left">
    <h2 class="text-3xl leading-tight lg:text-[2.5rem]" data-i18n="hero.hi"></h2>
    <span class="grad-text block text-5xl font-bold leading-tight lg:text-6xl">Guido Scotti</span>
    <h1 class="text-3xl leading-tight lg:text-5xl" data-i18n="hero.title"></h1>
    <a target="_blank" class="btn mt-4 w-44 text-2xl leading-[60px]" data-i18n="hero.cv" data-i18n-href="hero.cvUrl"></a>
  </div>
  <div class="hero-right mb-10 md:ml-24 lg:ml-52">
    <div class="rounded-full bg-linear-to-br from-[#00c6ff] via-brand to-[#00f2fe] p-1 shadow-[0_0_70px_rgba(0,114,255,0.45)]">
      <img src="./public/img/others/fotogui2.jpg" alt="Guido Scotti" class="size-52 rounded-full object-cover md:size-72 lg:size-[360px]">
    </div>
  </div>
</section>

<!-- ABOUT -->
<section id="about" class="reveal-up band-alt flex min-h-screen flex-col justify-center overflow-hidden px-5 pb-16 pt-28">
  <div class="relative mx-auto grid w-4/5 max-w-6xl items-center gap-10 lg:grid-cols-[1.5fr_1fr]">
    <div>
    <h1 class="sec-title" data-i18n="about.title"></h1>
    <h3 class="my-2.5 text-xl text-accent md:text-2xl" data-i18n="about.sub"></h3>
    <p class="my-7 text-base font-light md:text-xl lg:text-[1.38rem]" data-i18n="about.p1"></p>
    <p class="my-7 text-base font-light md:text-xl lg:text-[1.38rem]" data-i18n="about.p2"></p>
    </div>
    <div id="about-facts"></div>
  </div>
</section>

<!-- TECH STACK -->
<section id="techstack" class="reveal-up relative flex min-h-screen flex-col justify-center overflow-hidden px-5 pb-16 pt-28 text-center">
  <h1 class="sec-title" data-i18n="stack.title"></h1>
  <h2 class="sec-sub" data-i18n="stack.sub"></h2>
  <div id="stack" class="mx-auto grid w-[90%] max-w-5xl gap-5 md:grid-cols-2"></div>
</section>

<!-- EDUCATION -->
<section id="education" class="reveal-up band-alt flex min-h-screen flex-col justify-center overflow-hidden px-5 pb-24 pt-28 text-center">
  <h2 class="sec-sub" data-i18n="edu.title"></h2>
  <div id="edu-items" class="relative mx-auto w-full max-w-3xl space-y-6 pl-8 before:absolute before:bottom-2 before:left-[7px] before:top-2 before:w-px before:bg-linear-to-b before:from-accent before:via-brand before:to-transparent"></div>
</section>

<!-- PROJECTS -->
<section id="projects" class="reveal-up relative flex min-h-screen flex-col justify-center overflow-hidden px-5 pb-16 pt-28 text-center">
  <h1 class="sec-title" data-i18n="projectsSec.title"></h1>
  <h2 class="sec-sub" data-i18n="projectsSec.sub"></h2>
  <div id="projects-grid" class="relative mx-auto grid w-[90%] justify-items-center gap-6 md:w-[85%] md:grid-cols-2 lg:w-4/5 lg:max-w-5xl"></div>
</section>

<!-- CONTACTO -->
<section id="contacto" class="reveal-up band-glow relative flex min-h-screen flex-col justify-center overflow-hidden px-5 pb-16 pt-28 text-center">
  <h1 class="sec-title" data-i18n="contact.title"></h1>
  <h2 class="sec-sub text-xl md:text-2xl" data-i18n="contact.sub"></h2>
  <form id="contact-form" class="relative">
    <div class="mx-auto flex max-w-[95%] flex-col gap-5 md:max-w-[60%] lg:max-w-[40%]">
      <input class="field" type="text" name="name" data-i18n-ph="contact.name" required>
      <input class="field" type="email" name="email" data-i18n-ph="contact.email" required>
      <textarea class="field" name="message" rows="4" data-i18n-ph="contact.message" required></textarea>
    </div>
    <button type="submit" class="btn mt-6 w-36 text-lg leading-10" data-i18n="contact.send"></button>
  </form>
</section>

<div class="mx-auto h-[3px] w-4/5 bg-gray-300"></div>

<!-- FOOTER -->
<footer class="pb-5 pt-1 text-center text-sm text-gray-200">
  <div id="social-foot" class="mt-5 flex items-center justify-center gap-4"></div>
  <p class="mt-3" data-i18n="footer"></p>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
